name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: relayer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
